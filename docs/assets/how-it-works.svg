<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title description">
  <title id="title">How ToneWatch works</title>
  <desc id="description">Four steps: listen to a radio source, detect configured tones, record the dispatch, and send alerts.</desc>
  <rect width="1280" height="300" fill="#101827"/>
  <path d="M176.0 150.0H1104.0" stroke="#334968" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <rect x="40" y="40" width="272" height="220" rx="18" fill="#16213a" stroke="#243453" stroke-width="2"/>
  <text x="64" y="80" fill="#334968" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">01</text>
  <g transform="translate(176.0 110)" fill="none" stroke="#93b4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="-30" y="-12" width="60" height="40" rx="8"/><path d="M-14 -12 L14 -40"/><circle cx="-12" cy="8" r="8"/><path d="M6 2h14M6 14h14"/></g>
  <text x="176.0" y="182" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Listen</text>
  <text x="176.0" y="216" fill="#b9c6da" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Sound card, RTL-SDR,</text>
  <text x="176.0" y="240" fill="#b9c6da" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">network stream or WAV</text>
  <rect x="348" y="40" width="272" height="220" rx="18" fill="#16213a" stroke="#243453" stroke-width="2"/>
  <text x="372" y="80" fill="#334968" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">02</text>
  <g transform="translate(484.0 110)" fill="none" stroke="#93b4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 28h64"/><path d="M-24 28v-10M-14 28v-38M-4 28v-12M6 28v-8M16 28v-46M26 28v-10"/></g>
  <text x="484.0" y="182" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Detect</text>
  <text x="484.0" y="216" fill="#b9c6da" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Two-tone and long-tone</text>
  <text x="484.0" y="240" fill="#b9c6da" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">sequences you configure</text>
  <rect x="656" y="40" width="272" height="220" rx="18" fill="#16213a" stroke="#243453" stroke-width="2"/>
  <text x="680" y="80" fill="#334968" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">03</text>
  <g transform="translate(792.0 110)" fill="none" stroke="#93b4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="-20" cy="0" r="12" fill="#ef4444" stroke="none"/><path d="M2 0h6l5-16 7 32 5-16h8"/></g>
  <text x="792.0" y="182" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Record</text>
  <text x="792.0" y="216" fill="#b9c6da" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">Saves the dispatch</text>
  <text x="792.0" y="240" fill="#b9c6da" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">that follows the tones</text>
  <rect x="964" y="40" width="272" height="220" rx="18" fill="#16213a" stroke="#243453" stroke-width="2"/>
  <text x="988" y="80" fill="#334968" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">04</text>
  <g transform="translate(1100.0 110)" fill="none" stroke="#93b4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M-22 18h44M-16 18v-14a16 16 0 0 1 32 0v14M-5 26a5 5 0 0 0 10 0"/><path d="M0 -12v-6"/></g>
  <text x="1100.0" y="182" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Alert</text>
  <text x="1100.0" y="216" fill="#b9c6da" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">MQTT, Home Assistant,</text>
  <text x="1100.0" y="240" fill="#b9c6da" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">webhooks, Meshtastic</text>
</svg>
