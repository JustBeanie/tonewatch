name: tonewatch-rtlsdr
x-tonewatch: &tonewatch
  image: ghcr.io/justbeanie/tonewatch:latest
  # Bind to 127.0.0.1:8099:8099 for local-only access when exposing the UI.
  ports: ["8099:8099"]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes: [tonewatch-data:/data]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=2)"]
    interval: 30s
    timeout: 5s
    retries: 3
services:
  tonewatch:
    <<: *tonewatch
    # On the host, blacklist dvb_usb_rtl28xxu so rtl_fm can claim the dongle.
    devices: ["/dev/bus/usb:/dev/bus/usb"]
volumes:
  tonewatch-data:
