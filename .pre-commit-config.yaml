exclude: ^docs/pm/(reports|runs)/
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/uv.exe run --project backend --python 3.13.13 ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/uv.exe run --project backend --python 3.13.13 ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/uv.exe run --project backend --python 3.13.13 mypy backend/src backend/tests
        language: system
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/pnpm.cmd --dir web exec prettier --check .
        language: system
        files: ^web/
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/pnpm.cmd --dir web lint
        language: system
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/uv.exe run --project backend --python 3.13.13 shellcheck
        language: system
        types: [shell]
      - id: yamllint
        name: yamllint
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/uv.exe run --project backend --python 3.13.13 yamllint
        language: system
        types: [yaml]
        exclude: ^web/pnpm-lock\.yaml$
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/pnpm.cmd --dir web exec markdownlint-cli2
        language: system
        types: [markdown]
      - id: check-toml
        name: check-toml
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/uv.exe run --project backend --python 3.13.13 check-toml
        language: system
        types: [toml]
      - id: check-json
        name: check-json
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/uv.exe run --project backend --python 3.13.13 check-json
        language: system
        types: [json]
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/uv.exe run --project backend --python 3.13.13 end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/uv.exe run --project backend --python 3.13.13 python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
      - id: codespell
        name: codespell
        entry: cmd.exe /d /c C:/Users/beanie/Documents/Proj/tonewatch/.tools/bin/uv.exe run --project backend --python 3.13.13 codespell
        language: system
        types: [text]
        exclude: ^(docs/PROGRESS\.md|web/pnpm-lock\.yaml)$
      # These tools are intentionally manual/CI-only on Windows; see ADR 0002.
      - id: actionlint
        name: actionlint (CI/manual)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [manual]
      - id: hadolint
        name: hadolint (CI/manual)
        entry: hadolint
        language: system
        files: Dockerfile
        stages: [manual]
      - id: gitleaks
        name: gitleaks (CI/manual)
        entry: gitleaks protect --redact --staged
        language: system
        pass_filenames: false
        stages: [manual]
