# Vendored upstream sources must stay byte-identical to their pinned sha256 (see its README).
exclude: ^(docs/pm/(reports|runs)/|docs/security/asvs/source/)
repos:
  - repo: local
    hooks:
      - id: clean-room-naming
        name: clean-room naming
        entry: '(?i)two[ _-]?tone[ _-]?detect|\b\x74\x74\x64\b'
        language: pygrep
        types: [text]
        exclude: ^backend/tests/fixtures/private/
      - id: ruff
        name: ruff
        entry: uv run --project backend ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run --project backend ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --project backend mypy backend/src backend/tests scripts
        language: system
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: pnpm --dir web exec prettier --check .
        language: system
        files: ^web/
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: pnpm --dir web lint
        language: system
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: uv run --project backend shellcheck
        language: system
        types: [shell]
      - id: yamllint
        name: yamllint
        entry: uv run --project backend yamllint
        language: system
        types: [yaml]
        exclude: ^web/pnpm-lock\.yaml$
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: pnpm --dir web exec markdownlint-cli2
        language: system
        types: [markdown]
      - id: check-toml
        name: check-toml
        entry: uv run --project backend check-toml
        language: system
        types: [toml]
      - id: check-json
        name: check-json
        entry: uv run --project backend check-json
        language: system
        types: [json]
      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: uv run --project backend end-of-file-fixer
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trailing-whitespace
        entry: uv run --project backend python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
      - id: codespell
        name: codespell
        entry: uv run --project backend codespell
        language: system
        types: [text]
        exclude: ^(docs/PROGRESS\.md|web/pnpm-lock\.yaml)$
      # These tools are intentionally manual/CI-only on Windows; see ADR 0002.
      - id: actionlint
        name: actionlint (CI/manual)
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        stages: [manual]
      - id: hadolint
        name: hadolint (CI/manual)
        entry: hadolint
        language: system
        files: Dockerfile
        stages: [manual]
      - id: gitleaks
        name: gitleaks (CI/manual)
        entry: gitleaks protect --redact --staged
        language: system
        pass_filenames: false
        stages: [manual]
