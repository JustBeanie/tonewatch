name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions: {}

jobs:
  actionlint:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - name: Lint GitHub Actions workflows
        # No path args: actionlint discovers .github/workflows from the working dir (a host glob
        # would expand to host paths that do not exist inside the container).
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  action-pins:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Verify all workflow action pins
        run: uv run --project backend python scripts/check_action_pins.py .github/workflows/*.yml

  gitleaks:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Scan full history for secrets
        # gitleaks v8.19+ takes the repo as a positional arg; safe.directory because the
        # container user does not own the runner's checkout. --verbose prints file, line and rule
        # for each finding while --redact still hides the matched value.
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact --verbose --exit-code 1 /repo

  semgrep:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - name: Run Semgrep rulesets
        run: >-
          docker run --rm -v "$PWD:/src"
          semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
          semgrep scan --config p/python --config p/typescript
          --config p/owasp-top-ten --error

  sca:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Audit production Python dependencies
        run: |
          uv export --project backend --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx --from pip-audit pip-audit -r /tmp/requirements.txt
      - name: Audit development Python dependencies (informational)
        continue-on-error: true
        run: |
          uv export --project backend --frozen --no-emit-project --format requirements-txt > /tmp/requirements-dev.txt
          uvx --from pip-audit pip-audit -r /tmp/requirements-dev.txt
      - name: Audit lockfiles with OSV
        run: >-
          docker run --rm -v "$PWD:/src"
          ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734
          scan source -r /src/backend/uv.lock /src/web/pnpm-lock.yaml

  zizmor:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uvx --from zizmor zizmor .github/workflows

  trivy-config:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - run: >-
          docker run --rm -v "$PWD:/src"
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          config /src
      - run: >-
          docker run --rm -v "$PWD:/src"
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          config /src/docker

  licenses:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm --dir web install --frozen-lockfile
      # scripts/license_check.py: runtime deps only; denies GPL/AGPL by SPDX pattern
      # (pip-licenses --fail-on compared whole strings and never matched GPL-3.0-or-later).
      - name: Distribution license policy
        run: |
          uv export --project backend --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          pnpm --dir web licenses list --prod --json > "$RUNNER_TEMP/web-licenses.json"
          uv run --project backend python scripts/license_check.py \
            --python-requirements "$RUNNER_TEMP/requirements.txt" \
            --web-licenses "$RUNNER_TEMP/web-licenses.json"

  local-security:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm --dir web install --frozen-lockfile
      # The runner image has no `just`; rust-just is its official PyPI distribution.
      - run: uvx --from rust-just just security
