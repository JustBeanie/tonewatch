name: Security

# Static checks run on every main push, docs included, so secrets in PM briefs are still caught.
# Dependency audits, licenses and the full `just security` moved to security-deps.yml, which runs
# only on dependency changes, weekly and on manual dispatch (Actions-minutes diet, 2026-09-12).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - name: Lint GitHub Actions workflows
        # No path args: actionlint discovers .github/workflows from the working dir (a host glob
        # would expand to host paths that do not exist inside the container).
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  action-pins:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Verify all workflow action pins
        run: uv run --project backend python scripts/check_action_pins.py .github/workflows/*.yml

  gitleaks:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Scan full history for secrets
        # gitleaks v8.19+ takes the repo as a positional arg; safe.directory because the
        # container user does not own the runner's checkout. --verbose prints file, line and rule
        # for each finding while --redact still hides the matched value.
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact --verbose --exit-code 1 /repo

  semgrep:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - name: Run Semgrep rulesets
        run: >-
          docker run --rm -v "$PWD:/src"
          semgrep/semgrep@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
          semgrep scan --config p/python --config p/typescript
          --config p/owasp-top-ten --error

  zizmor:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uvx --from zizmor zizmor .github/workflows

  trivy-config:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - run: >-
          docker run --rm -v "$PWD:/src"
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          config /src
      - run: >-
          docker run --rm -v "$PWD:/src"
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          config /src/docker
