name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime-closure:
    permissions: {contents: read}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2
      - name: Install only runtime dependencies and import every module
        run: |
          venv="$RUNNER_TEMP/tonewatch-runtime-venv"
          requirements="$RUNNER_TEMP/tonewatch-runtime-requirements.txt"
          dist="$RUNNER_TEMP/tonewatch-runtime-dist"
          uv venv --python 3.13 "$venv"
          uv export --project backend --frozen --no-dev --no-emit-project --format requirements-txt > "$requirements"
          uv pip install --python "$venv/bin/python" -r "$requirements"
          uv build --project backend --wheel --out-dir "$dist"
          uv pip install --python "$venv/bin/python" "$dist"/*.whl
          "$venv/bin/python" - <<'PY'
          import importlib
          import pkgutil
          import tonewatch

          modules = [tonewatch.__name__]
          modules.extend(module.name for module in pkgutil.walk_packages(tonewatch.__path__, "tonewatch."))
          for name in modules:
              importlib.import_module(name)
          print(f"imported {len(modules)} runtime modules")
          PY
  test-python:
    permissions: {contents: read}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # The sounddevice wheel bundles PortAudio on Windows/macOS only.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2
      - run: uv sync --project backend
      - run: uv run --project backend python backend/scripts/run_pytest.py -v
      - run: uv run --project backend python backend/scripts/check_package_coverage.py
  lint-python:
    permissions: {contents: read}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv run --project backend ruff check backend scripts docs/pm
      - run: uv run --project backend ruff format --check backend scripts docs/pm
  typecheck:
    permissions: {contents: read}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --project backend
      - run: uv run --project backend mypy backend/src backend/tests
  lint-web:
    permissions: {contents: read}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web exec prettier --check .
  test-web:
    permissions: {contents: read}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec tsc -b
      - run: pnpm --dir web test
  api-client-drift:
    permissions: {contents: read}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm --dir web install --frozen-lockfile
      # Exporting OpenAPI imports the app, which imports sounddevice (needs PortAudio on Linux).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2
      # The runner image has no `just`; rust-just is its official PyPI distribution.
      - run: uvx --from rust-just just gen-api
      - run: git diff --exit-code -- web/src/api
  e2e:
    permissions: {contents: read}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2
      - run: uv sync --project backend
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: uvx --from rust-just just e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
