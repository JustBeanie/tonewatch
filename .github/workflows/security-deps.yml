name: Security (dependencies)

# The heavier supply-chain checks split out of security.yml (Actions-minutes diet, 2026-09-12).
# They run when a dependency manifest or lockfile changes, weekly (new advisories appear without
# code changes) and on manual dispatch. `just security` runs all of them locally before every push.
on:
  push:
    branches: [main]
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "scripts/license_check.py"
      - "justfile"
      - ".github/workflows/security-deps.yml"
  pull_request:
    paths:
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "scripts/license_check.py"
      - "justfile"
      - ".github/workflows/security-deps.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: security-deps-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  sca:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Audit production Python dependencies
        run: |
          uv export --project backend --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uvx --from pip-audit pip-audit -r /tmp/requirements.txt
      - name: Audit development Python dependencies (informational)
        continue-on-error: true
        run: |
          uv export --project backend --frozen --no-emit-project --format requirements-txt > /tmp/requirements-dev.txt
          uvx --from pip-audit pip-audit -r /tmp/requirements-dev.txt
      - name: Audit lockfiles with OSV
        run: >-
          docker run --rm -v "$PWD:/src"
          ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734
          scan source -r /src/backend/uv.lock /src/web/pnpm-lock.yaml

  licenses:
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm --dir web install --frozen-lockfile
      # scripts/license_check.py: runtime deps only; denies GPL/AGPL by SPDX pattern
      # (pip-licenses --fail-on compared whole strings and never matched GPL-3.0-or-later).
      - name: Distribution license policy
        run: |
          uv export --project backend --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          pnpm --dir web licenses list --prod --json > "$RUNNER_TEMP/web-licenses.json"
          uv run --project backend python scripts/license_check.py \
            --python-requirements "$RUNNER_TEMP/requirements.txt" \
            --web-licenses "$RUNNER_TEMP/web-licenses.json"

  local-security:
    # Duplicates sca, licenses, zizmor and the pin check in one job; weekly and manual only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions: {contents: read}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm --dir web install --frozen-lockfile
      # The runner image has no `just`; rust-just is its official PyPI distribution.
      - run: uvx --from rust-just just security
