[project]
name = "tonewatch"
version = "0.1.0"
description = "Clean-room two-tone radio notification tool"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "av>=14.0",
  "numpy>=2.1",
  "sounddevice>=0.5",
]

[project.scripts]
tonewatch = "tonewatch.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pre-commit-hooks>=5.0",
  "shellcheck-py>=0.10.0.1",
  "yamllint>=1.35",
  "codespell>=2.3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tonewatch"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF", "S", "ASYNC", "PL", "PERF", "FURB", "TRY", "RET", "ARG", "ERA", "TC", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
mypy_path = "src"
plugins = []

[tool.pytest.ini_options]
addopts = "--strict-markers -W error --cov=tonewatch --cov-fail-under=85 --cov-report=json:coverage.json -p no:cacheprovider"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["av", "sounddevice"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["test_audio_libs", "tests.spike.test_audio_libs"]
# The spike exercises runtime PyAV APIs whose third-party stubs expose broad unions.
ignore_errors = true

[tool.coverage.run]
branch = true
