[project]
name = "tonewatch"
version = "0.4.0"
description = "Clean-room two-tone radio notification tool"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "aiosqlite>=0.22.1",
  "aiomqtt>=2.4",
  "alembic>=1.19.2",
  "av>=14.0",
  "certifi>=2024.8.30",
  "fastapi>=0.115",
  "httpx>=0.28",
  "numpy>=2.1",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "pyyaml>=6.0.3",
  "sounddevice>=0.5",
  "sqlalchemy>=2.0.52",
  "structlog>=24.4",
  "tzdata>=2024.1",
  "types-pyyaml>=6.0.12.20260906",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.20",
  "pywin32>=308; sys_platform == 'win32'",
  "zeroconf>=0.148",
]

[project.scripts]
tonewatch = "tonewatch.__main__:main"
tonewatch-gen = "tonewatch.dsp.generator:main"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pre-commit-hooks>=5.0",
  "pyinstaller>=6.11",
  "shellcheck-py>=0.10.0.1",
  "yamllint>=1.35",
  "codespell>=2.3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "pytest-benchmark>=5.1",
  "hypothesis>=6.100",
  "amqtt>=0.11",
  "ruff>=0.8",
]
docs = [
    "mkdocs-material>=9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tonewatch"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PTH", "RUF", "S", "ASYNC", "PL", "PERF", "FURB", "TRY", "RET", "ARG", "ERA", "TC", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D"]
"src/tonewatch/config/models.py" = ["D101", "D102", "E501", "TRY003", "TRY301"]
"src/tonewatch/config/store.py" = ["D107", "TRY003", "PTH105"]
"src/tonewatch/events.py" = ["D101", "D102", "D105", "D107", "TRY003"]
"src/tonewatch/storage/models.py" = ["D101", "E501"]
"src/tonewatch/storage/repository.py" = ["D101"]
"src/tonewatch/storage/migrations/**" = ["D103", "E501"]
"src/tonewatch/__main__.py" = ["PLR2004", "TRY003", "PLC0415", "I001"]
"src/tonewatch/api/*.py" = ["D", "PLR", "TRY003", "TRY301", "ASYNC240", "B008", "TC001", "TC002", "TC003", "ARG", "PTH", "S101", "RUF012", "PLC0415"]
"tests/integration/test_api.py" = ["S106"]
"tests/integration/test_api_security.py" = ["S106", "PLC0415", "TRY003"]
"tests/integration/test_api_resources.py" = ["S106", "ARG001", "ASYNC240"]
"src/tonewatch/sources/*.py" = [
  "ASYNC240",
  "D",
  "N818",
  "PLC0415",
  "PLR2004",
  "PLR0913",
  "PTH",
  "S101",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
]
"src/tonewatch/pipeline/*.py" = ["D107", "D102", "PLR0913", "TRY003", "ASYNC240"]
"src/tonewatch/recording/*.py" = ["D101", "D102", "D107", "E501", "PLR0913", "PLR0917", "TRY003", "ASYNC240", "PTH105", "TC001", "TC002", "TC003"]
"src/tonewatch/alerts/*.py" = ["D", "E501", "N818", "PTH", "PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004", "TRY003", "TRY301", "TC001", "TC003", "SIM105", "S110", "FURB166"]
"tests/unit/test_m7_alerts.py" = ["E501", "ARG001", "S106", "RET504", "UP037"]
# DSP: the brief fixes the public constructors' keyword tuning parameters (PLR0913,
# PLR0917) and the matcher's per-sequence state machine (PLR0912); DSP constants such as
# window sizes and the 250-3000 Hz band are domain values, not magic numbers (PLR2004).
"src/tonewatch/dsp/*.py" = [
  "D107",
  "PLR0912",
  "PLR0913",
  "PLR0917",
  "PLR2004",
  "TRY003",
]
"tests/golden/scenarios.py" = ["E501", "PLR0913", "RUF005"]
"tests/golden/test_scenarios.py" = ["E501", "TRY003"]
"tests/unit/test_dsp_contracts.py" = ["E501", "PERF401"]
"tests/unit/test_dsp_edges.py" = ["E501"]
"tests/unit/test_dsp_properties.py" = ["E501"]
"tests/unit/test_sources.py" = ["ARG005", "PLC0415", "RUF012"]
"tests/unit/test_pipeline.py" = ["TRY003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
mypy_path = "src"
plugins = []

[tool.pytest.ini_options]
addopts = "--strict-markers -W error --cov=tonewatch --cov-fail-under=85 --cov-report=json:coverage.json -p no:cacheprovider"
timeout = 120
faulthandler_timeout = 60
testpaths = ["tests"]
markers = [
  "slow: long-running false-positive and endurance tests",
  "allow_real_audio: explicitly opt into host audio hardware",
  "real_zeroconf: explicitly opt into zeroconf integration behavior",
]

[[tool.mypy.overrides]]
# PLAN.md: no explicit Any in the detection engine.
module = ["tonewatch.dsp", "tonewatch.dsp.*"]
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = ["av", "sounddevice", "tonewatch.sources.soundcard"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["test_audio_libs", "tests.spike.test_audio_libs"]
# The spike exercises runtime PyAV APIs whose third-party stubs expose broad unions.
ignore_errors = true

[tool.coverage.run]
branch = true
